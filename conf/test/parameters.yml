data_unit_tests_cleaned:
  dropped_columns:
    - PublishDate
    - Floor
    - ConservationStatus
    - EnergyEfficiencyLevel
    - City
    - Town
  row_count:
    min: 1
    max: 1000
  not_null_columns:
    - Price_log
    - District
  column_types:
    Price_log: float64
    LivingArea_log: float64
    TotalArea_log: float64
    GrossArea_log: float64
    BuiltArea_log: float64
    LotSize_log: float64
    Parking: float64
    TotalRooms: float64
    NumberOfBedrooms: float64
    NumberOfBathrooms: float64
    NumberOfWC: float64
    ConstructionYear: float64
    EnergyCertificate: int64
    Garage: float64
    Elevator: float64
    ElectricCarsCharging: float64
    HasParking: float64
    District: object
    Type: object
  ranges:
    Price_log: { min: 0, strict_min: true }
    LivingArea_log: { min: 0 }
    TotalArea_log: { min: 0 }
    GrossArea_log: { min: 0 }
    BuiltArea_log: { min: 0 }
    LotSize_log: { min: 0 }
    Parking: { min: 0 }
    TotalRooms: { min: 0 }
    NumberOfBedrooms: { min: 0 }
    NumberOfBathrooms: { min: 0 }
    NumberOfWC: { min: 0 }
    ConstructionYear: { min: 1800, max: 2026 }
    EnergyCertificate: { min: 0, max: 9 }
    Garage: { min: 0, max: 1 }
    Elevator: { min: 0, max: 1 }
    ElectricCarsCharging: { min: 0, max: 1 }
