# Champion config + Model Registry + SHAP/feature selection.

model_train:
  # baseline (fallback when there is no champion yet) — ⚠️ catch FileNotFoundError, not a bare except
  baseline_model_params:
    n_estimators: 200
    max_depth: 12
    random_state: 42

  # feature selection (blueprint option A): champion SHAP -> best_cols -> retrain
  use_feature_selection: false   # TODO: set True on the 2nd pass, after feature_selection produces best_cols

  # MLflow Model Registry (our own addition)
  registry:
    model_name: "house_price_model"
    challenger_alias: "challenger"
    champion_alias: "champion"

  # SHAP / feature_selection
  shap:
    top_n: 15                    # top-N features by mean |SHAP| (or use a threshold)
    # threshold: null

  metrics:                       # REGRESSION metrics to log (not accuracy!)
    - rmse
    - mae
    - r2
