preprocessing:

  # Target column
  target_col: Price_log

  # Train/test split
  test_size: 0.2
  random_state: 23

  # Impossible value thresholds
  min_construction_year: 1800
  max_construction_year: 2026

  # Implausible value thresholds
  max_bedrooms: 20
  max_bathrooms: 20
  max_wc: 20
  max_total_rooms: 50

  # Imputation strategy
  numeric_strategy: median
  categorical_strategy: most_frequent

  # Outlier capping (percentile thresholds, fitted on train only)
  # Area columns excluded — log1p already compresses extremes
  # Only count-based columns need capping
  percentile_thresholds:
    NumberOfBedrooms:  0.995
    NumberOfBathrooms: 0.995
    NumberOfWC:        0.995
    TotalRooms:        0.990

  # Ordinal encoding for EnergyCertificate (A+ = best, No Rating = worst)
  energy_ordinal_map:
    "A+": 9
    A:    8
    B:    7
    "B-": 6
    C:    5
    D:    4
    E:    3
    F:    2
    G:    1
    No Rating: 0