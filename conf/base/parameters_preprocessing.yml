preprocessing:

  # Target column
  target_col: Price_log
  batch_has_target: false   # true only for a labelled batch (drift / performance estimation)

  # Train/test split
  test_size: 0.2
  random_state: 23

  # Impossible value thresholds
  min_construction_year: 1800
  max_construction_year: 2026

  # Implausible value thresholds
  max_bedrooms: 20
  max_bathrooms: 20
  max_wc: 20
  max_total_rooms: 50

  