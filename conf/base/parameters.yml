# GLOBAL parameters — read by ALL nodes, never inline (blueprint convention).
# Pipeline-specific parameters live in parameters_*.yml.

# TODO parameters.yml:
seed: 42                     # random_state read by all nodes
target_col: "Price"
use_log_target: true         # test log1p — EDA shows strong skew; document in ASSUMPTIONS.md

# Expected raw columns (validated in ingestion/data_unit_tests)
raw_columns:
  - Price
  - District
  - City
  - Town
  - Type
  - EnergyCertificate
  - GrossArea
  - TotalArea
  - Parking
  - HasParking
  - Floor
  - ConstructionYear
  - EnergyEfficiencyLevel
  - PublishDate
  - Garage
  - Elevator
  - ElectricCarsCharging
  - TotalRooms
  - NumberOfBedrooms
  - NumberOfWC
  - ConservationStatus
  - LivingArea
  - LotSize
  - BuiltArea
  - NumberOfBathrooms

# TODO: review the numeric/categorical split based on EDA
numeric_features:
  - GrossArea
  - TotalArea
  - LivingArea
  - LotSize
  - BuiltArea
  - ConstructionYear
  - TotalRooms
  - NumberOfBedrooms
  - NumberOfWC
  - NumberOfBathrooms
  - Parking

categorical_features:
  - District
  - City
  - Town
  - Type
  - EnergyCertificate
  - EnergyEfficiencyLevel
  - Floor
  - ConservationStatus
  - HasParking
  - Garage
  - Elevator
  - ElectricCarsCharging

# --- ingestion ---------------------------------------------------------------
ingestion:
  target_col: ${target_col}      # OmegaConf interpolation of the global value
  seed: ${seed}
  primary_key: "index"
  run_validation: true           # ephemeral GX validation before upload (raise on failure)
  reference_fraction: 0.8        # fraction for learning_data; the rest goes to test_data (batch)
  feature_group_version: 1
  feature_groups:
    numerical:   {name: house_numerical,   version: 1, description: "Numeric housing features"}
    categorical: {name: house_categorical, version: 1, description: "Categorical housing features"}
    target:      {name: house_target,      version: 1, description: "Target (Price)"}
  to_feature_store: false

# --- data_drift --------------------------------------------------------------
data_drift:
  engine: "evidently"           # evidently 0.7.x (Report + DataDriftPreset)
  drift_share_threshold: 0.5    # flag DATASET drift if >= this fraction of columns drifted
  # curated columns to monitor (avoid City/Town — very high cardinality)
  numeric_features:
    - Price
    - GrossArea
    - TotalArea
    - LivingArea
    - LotSize
    - BuiltArea
    - ConstructionYear
    - TotalRooms
    - NumberOfBedrooms
    - NumberOfWC
    - NumberOfBathrooms
    - Parking
  categorical_features:
    - District
    - Type
    - EnergyCertificate
  # EXTRA (professor's tip): inject artificial drift into the batch to demonstrate detection
  inject_artificial_drift: false
  numeric_shift_pct: 0.3        # multiply numeric features by (1 + this) when injecting

# --- reporting ---------------------------------------------------------------
reporting:
  # TODO: consolidated report config
  report_path: "data/08_reporting"
