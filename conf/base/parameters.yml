# GLOBAL parameters — read by ALL nodes, never inline (blueprint convention).
# Pipeline-specific parameters live in parameters_*.yml.

# TODO parameters.yml:
seed: 42                     # random_state read by all nodes
target_col: "Price"
use_log_target: true         # test log1p — EDA shows strong skew; document in ASSUMPTIONS.md

# Expected raw columns (validated in ingestion/data_unit_tests)
raw_columns:
  - Price
  - District
  - City
  - Town
  - Type
  - EnergyCertificate
  - GrossArea
  - TotalArea
  - Parking
  - HasParking
  - Floor
  - ConstructionYear
  - EnergyEfficiencyLevel
  - PublishDate
  - Garage
  - Elevator
  - ElectricCarsCharging
  - TotalRooms
  - NumberOfBedrooms
  - NumberOfWC
  - ConservationStatus
  - LivingArea
  - LotSize
  - BuiltArea
  - NumberOfBathrooms

# TODO: review the numeric/categorical split based on EDA
numeric_features:
  - GrossArea
  - TotalArea
  - LivingArea
  - LotSize
  - BuiltArea
  - ConstructionYear
  - TotalRooms
  - NumberOfBedrooms
  - NumberOfWC
  - NumberOfBathrooms
  - Parking

categorical_features:
  - District
  - City
  - Town
  - Type
  - EnergyCertificate
  - EnergyEfficiencyLevel
  - Floor
  - ConservationStatus
  - HasParking
  - Garage
  - Elevator
  - ElectricCarsCharging

# --- ingestion ---------------------------------------------------------------
ingestion:
  target_col: ${target_col}      # OmegaConf interpolation of the global value
  seed: ${seed}
  primary_key: "index"
  run_validation: true           # ephemeral GX validation before upload (raise on failure)
  reference_fraction: 0.8        # fraction for learning_data; the rest goes to test_data (batch)
  event_time: "PublishDate"      # NOTE: ~78% null -> used only in the FS (Phase 5), not in the split
  feature_group_version: 1
  # TODO: run the feature-store upload only if True (so whoever lacks a Hopsworks key
  #       runs the rest of the pipeline from local CSVs).
  to_feature_store: false

# --- data_drift --------------------------------------------------------------
data_drift:
  # TODO: drift engine and config
  engine: "evidently"          # or "nannyml"
  # features_to_monitor: [...]  # subset to monitor (default: numeric_features)
  # inject_artificial_drift: false  # extra: inject drift to demonstrate detection

# --- reporting ---------------------------------------------------------------
reporting:
  # TODO: consolidated report config
  report_path: "data/08_reporting"
