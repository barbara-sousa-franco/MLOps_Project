# Data Catalog — house-price case (portugal_listings).
# Convention: anything that should go to MLflow uses MlflowArtifactDataset.
# Docs: https://docs.kedro.org/en/stable/data/data_catalog.html
#
# General TODO:
#   - confirm the types (CSV/Pickle/JSON/Matplotlib) and versioning
#   - datasets coming from the feature store (ingested_data/ref_data/ana_data) can be
#     materialized as local CSVs for those without a Hopsworks key (see risks in the report)

# --- 01_raw -------------------------------------------------------------------
raw_house_data:
  type: pandas.CSVDataset
  filepath: data/01_raw/portugal_listings.csv
  load_args:
    low_memory: false
    encoding: latin-1      

# --- 02_intermediate ----------------------------------------------------------
ingested_data:
  type: pandas.CSVDataset
  filepath: data/02_intermediate/ingested_data.csv
  load_args:
    low_memory: false           # mixed types (many nulls) -> avoids DtypeWarning

ref_data:                       # reference for drift (training distribution)
  type: pandas.CSVDataset
  filepath: data/02_intermediate/ref_data.csv
  load_args:
    low_memory: false

ana_data:                       # batch to analyse for drift / inference
  type: pandas.CSVDataset
  filepath: data/02_intermediate/ana_data.csv
  load_args:
    low_memory: false

cleaned_data:
  type: pandas.CSVDataset
  filepath: data/02_intermediate/cleaned_data.csv
  load_args:
    low_memory: false
    encoding: latin-1
  save_args:
    index: false
    encoding: latin-1
 
reporting_data_preprocessing:
  type: json.JSONDataset
  filepath: data/08_reporting/preprocessing_report.json

# --- 03_primary ---------------------------------------------------------------
preprocessed_training_data:
  type: pandas.CSVDataset
  filepath: data/03_primary/preprocessed_train_data.csv

preprocessed_batch_data:
  type: pandas.CSVDataset
  filepath: data/03_primary/preprocessed_batch_data.csv

X_train_data:
  type: pandas.CSVDataset
  filepath: data/03_primary/X_train.csv
  load_args:
    encoding: latin-1
  save_args:
    index: false
    encoding: latin-1

X_test_data:
  type: pandas.CSVDataset
  filepath: data/03_primary/X_test.csv
  load_args:
    encoding: latin-1
  save_args:
    index: false
    encoding: latin-1

y_train_data:
  type: pandas.CSVDataset
  filepath: data/03_primary/y_train.csv
  load_args:
    encoding: latin-1
  save_args:
    index: false
    encoding: latin-1

y_test_data:
  type: pandas.CSVDataset
  filepath: data/03_primary/y_test.csv
  load_args:
    encoding: latin-1
  save_args:
    index: false
    encoding: latin-1

X_train_imputed:
  type: pandas.CSVDataset
  filepath: data/03_primary/X_train_imputed.csv
  load_args:
    encoding: latin-1
  save_args:
    index: false
    encoding: latin-1

X_test_imputed:
  type: pandas.CSVDataset
  filepath: data/03_primary/X_test_imputed.csv
  load_args:
    encoding: latin-1
  save_args:
    index: false
    encoding: latin-1

X_train_processed:
  type: pandas.CSVDataset
  filepath: data/03_primary/X_train_processed.csv
  load_args:
    encoding: latin-1
  save_args:
    index: false
    encoding: latin-1

X_test_processed:
  type: pandas.CSVDataset
  filepath: data/03_primary/X_test_processed.csv
  load_args:
    encoding: latin-1
  save_args:
    index: false
    encoding: latin-1

# FINAL features (post feature_engineering) that enter modelling
X_train_encoded:
  type: pandas.CSVDataset
  filepath: data/03_primary/X_train_encoded.csv
  load_args:
    encoding: latin-1
  save_args:
    index: false
    encoding: latin-1

X_test_encoded:
  type: pandas.CSVDataset
  filepath: data/03_primary/X_test_encoded.csv
  load_args:
    encoding: latin-1
  save_args:
    index: false
    encoding: latin-1

# --- 04_feature ---------------------------------------------------------------
encoder_transform:              # MLflow artifact (Pickle)
  type: kedro_mlflow.io.artifacts.MlflowArtifactDataset
  dataset:
    type: pickle.PickleDataset
    filepath: data/04_feature/encoder.pkl

num_imputer:
  type: kedro_mlflow.io.artifacts.MlflowArtifactDataset
  dataset:
    type: pickle.PickleDataset
    filepath: data/04_feature/num_imputer.pkl

cat_imputer:
  type: kedro_mlflow.io.artifacts.MlflowArtifactDataset
  dataset:
    type: pickle.PickleDataset
    filepath: data/04_feature/cat_imputer.pkl

capper:
  type: kedro_mlflow.io.artifacts.MlflowArtifactDataset
  dataset:
    type: pickle.PickleDataset
    filepath: data/04_feature/capper.pkl

target_encoder:                 # MLflow artifact (Pickle) — fit on train (anti-leakage)
  type: kedro_mlflow.io.artifacts.MlflowArtifactDataset
  dataset:
    type: pickle.PickleDataset
    filepath: data/04_feature/target_encoder.pkl

# --- 06_models ----------------------------------------------------------------
selected_model:                 # MLflow artifact (Pickle) — best model from model_selection
  type: kedro_mlflow.io.artifacts.MlflowArtifactDataset
  dataset:
    type: pickle.PickleDataset
    filepath: data/06_models/selected_model.pkl

all_columns:                    # post-split column list (split_train output)
  type: kedro_mlflow.io.artifacts.MlflowArtifactDataset
  dataset:
    type: pickle.PickleDataset
    filepath: data/06_models/all_columns.pkl

best_columns:                   # MLflow artifact (Pickle) — SHAP output
  type: kedro_mlflow.io.artifacts.MlflowArtifactDataset
  dataset:
    type: pickle.PickleDataset
    filepath: data/06_models/best_cols.pkl

production_columns:             # MLflow artifact (Pickle)
  type: kedro_mlflow.io.artifacts.MlflowArtifactDataset
  dataset:
    type: pickle.PickleDataset
    filepath: data/06_models/production_cols.pkl

production_model:               # MLflow artifact (Pickle) — the champion
  type: kedro_mlflow.io.artifacts.MlflowArtifactDataset
  dataset:
    type: pickle.PickleDataset
    filepath: data/06_models/production_model.pkl

# --- 07_model_output ----------------------------------------------------------
predictions:
  type: pandas.CSVDataset
  filepath: data/07_model_output/predictions.csv

# --- 08_reporting -------------------------------------------------------------
reporting_tests:                # data unit test results (GX)
  type: pandas.CSVDataset
  filepath: data/08_reporting/data_tests.csv

reporting_tests_cleaned:
  type: pandas.CSVDataset
  filepath: data/08_reporting/validation_cleaned_data.csv

reporting_tests_model_input:
  type: pandas.CSVDataset
  filepath: data/08_reporting/validation_model_input.csv

traffic_light_flag:
  type: text.TextDataset
  filepath: data/08_reporting/traffic_light.txt

production_model_metrics:       # MLflow artifact (JSON) — RMSE/MAE/R²
  type: kedro_mlflow.io.artifacts.MlflowArtifactDataset
  dataset:
    type: json.JSONDataset
    filepath: data/08_reporting/production_model_metrics.json

drift_result:
  type: pandas.CSVDataset
  filepath: data/08_reporting/drift_result.csv

drift_report:                   # HTML from nannyml/evidently
  type: text.TextDataset
  filepath: data/08_reporting/data_drift_report.html

shap_plot:                      # MLflow artifact (Matplotlib)
  type: kedro_mlflow.io.artifacts.MlflowArtifactDataset
  dataset:
    type: matplotlib.MatplotlibDataset
    filepath: data/08_reporting/shap_plot.png

shap_values:
  type: pickle.PickleDataset
  filepath: data/08_reporting/shap_values.pkl

# NOTE: `best_columns` is defined once above (06_models, MLflow artifact) — duplicate removed.
challenger_model:
  type: pickle.PickleDataset
  filepath: data/06_models/challenger_model.pkl
challenger_params:
  type: kedro_mlflow.io.artifacts.MlflowArtifactDataset
  dataset:
    type: json.JSONDataset
    filepath: data/06_models/challenger_params.json
promoted_model:
  type: kedro_mlflow.io.models.MlflowModelTrackingDataset
  flavor: mlflow.sklearn
  save_args:
    artifact_path: promoted_model
champion_challenger_report:
  type: kedro_mlflow.io.artifacts.MlflowArtifactDataset
  dataset:
    type: json.JSONDataset
    filepath: data/08_reporting/champion_challenger_report.json
champion_challenger_metrics:
  type: kedro_mlflow.io.metrics.MlflowMetricsHistoryDataset

