# --- 04_feature ---------------------------------------------------------------
encoder_transform:              # MLflow artifact (Pickle)
  type: kedro_mlflow.io.artifacts.MlflowArtifactDataset
  dataset:
    type: pickle.PickleDataset
    filepath: data/04_feature/encoder.pkl

# single GroupImputer produced by preproc_after_split (impute_missing) and reused by
# preprocessing_batch via transform. (Replaces the old num_imputer/cat_imputer pair.)
imputer:
  type: kedro_mlflow.io.artifacts.MlflowArtifactDataset
  dataset:
    type: pickle.PickleDataset
    filepath: data/04_feature/imputer.pkl

capper:
  type: kedro_mlflow.io.artifacts.MlflowArtifactDataset
  dataset:
    type: pickle.PickleDataset
    filepath: data/04_feature/capper.pkl

target_encoder:                 # MLflow artifact (Pickle) — fit on train (anti-leakage)
  type: kedro_mlflow.io.artifacts.MlflowArtifactDataset
  dataset:
    type: pickle.PickleDataset
    filepath: data/04_feature/target_encoder.pkl

X_train_scaled:
  type: pandas.ParquetDataset
  filepath: data/05_model_input/X_train_scaled.parquet
X_val_scaled:
  type: pandas.ParquetDataset
  filepath: data/05_model_input/X_val_scaled.parquet
scaler:
  type: pickle.PickleDataset
  filepath: data/04_feature/scaler.pkl

# --- 06_models ----------------------------------------------------------------
selected_model:                 # MLflow artifact (Pickle) — best model from model_selection
  type: kedro_mlflow.io.artifacts.MlflowArtifactDataset
  dataset:
