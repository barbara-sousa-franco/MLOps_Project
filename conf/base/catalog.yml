# Data Catalog — caso das casas (portugal_listings).
# Convenção: tudo o que deve ir para o MLflow usa MlflowArtifactDataset (truque do prof).
# Docs: https://docs.kedro.org/en/stable/data/data_catalog.html
#
# TODO geral:
#   - confirmar os tipos (CSV/Pickle/JSON/Matplotlib) e versionamento
#   - os datasets vindos da feature store (ingested_data/ref_data/ana_data) podem ser
#     materializados em CSV local para quem não tiver Hopsworks key (ver risks no relatório)

# --- 01_raw -------------------------------------------------------------------
raw_house_data:
  type: pandas.CSVDataset
  filepath: data/01_raw/portugal_listings.csv
  load_args:
    low_memory: false        # várias colunas têm tipos mistos (nulls) — evita DtypeWarning

# --- 02_intermediate ----------------------------------------------------------
ingested_data:
  type: pandas.CSVDataset
  filepath: data/02_intermediate/ingested_data.csv
  load_args:
    low_memory: false           # tipos mistos (nulls elevados) -> evita DtypeWarning

ref_data:                       # referência p/ drift (distribuição de treino)
  type: pandas.CSVDataset
  filepath: data/02_intermediate/ref_data.csv
  load_args:
    low_memory: false

ana_data:                       # batch a analisar p/ drift / inferência
  type: pandas.CSVDataset
  filepath: data/02_intermediate/ana_data.csv
  load_args:
    low_memory: false

cleaned_data:
  type: pandas.CSVDataset
  filepath: data/02_intermediate/cleaned_data.csv
  load_args:
    low_memory: false

# --- 03_primary ---------------------------------------------------------------
preprocessed_training_data:
  type: pandas.CSVDataset
  filepath: data/03_primary/preprocessed_train_data.csv

preprocessed_batch_data:
  type: pandas.CSVDataset
  filepath: data/03_primary/preprocessed_batch_data.csv

X_train_data:
  type: pandas.CSVDataset
  filepath: data/03_primary/X_train.csv

X_test_data:
  type: pandas.CSVDataset
  filepath: data/03_primary/X_test.csv

y_train_data:
  type: pandas.CSVDataset
  filepath: data/03_primary/y_train.csv

y_test_data:
  type: pandas.CSVDataset
  filepath: data/03_primary/y_test.csv

# --- 04_feature ---------------------------------------------------------------
encoder_transform:              # artifact MLflow (Pickle)
  type: kedro_mlflow.io.artifacts.MlflowArtifactDataset
  dataset:
    type: pickle.PickleDataset
    filepath: data/04_feature/encoder.pkl

# --- 05_model_input -----------------------------------------------------------
X_train:
  type: pandas.CSVDataset
  filepath: data/05_model_input/X_train.csv
X_test:
  type: pandas.CSVDataset
  filepath: data/05_model_input/X_test.csv
y_train:
  type: pandas.CSVDataset
  filepath: data/05_model_input/y_train.csv
y_test:
  type: pandas.CSVDataset
  filepath: data/05_model_input/y_test.csv

# --- 06_models ----------------------------------------------------------------
best_columns:                   # artifact MLflow (Pickle) — saída do SHAP
  type: kedro_mlflow.io.artifacts.MlflowArtifactDataset
  dataset:
    type: pickle.PickleDataset
    filepath: data/06_models/best_cols.pkl

production_columns:             # artifact MLflow (Pickle)
  type: kedro_mlflow.io.artifacts.MlflowArtifactDataset
  dataset:
    type: pickle.PickleDataset
    filepath: data/06_models/production_cols.pkl

production_model:               # artifact MLflow (Pickle) — o champion
  type: kedro_mlflow.io.artifacts.MlflowArtifactDataset
  dataset:
    type: pickle.PickleDataset
    filepath: data/06_models/production_model.pkl

# --- 07_model_output ----------------------------------------------------------
predictions:
  type: pandas.CSVDataset
  filepath: data/07_model_output/predictions.csv

# --- 08_reporting -------------------------------------------------------------
reporting_tests:                # resultado dos data unit tests (GX)
  type: pandas.CSVDataset
  filepath: data/08_reporting/data_tests.csv

reporting_tests_cleaned:
  type: pandas.CSVDataset
  filepath: data/08_reporting/validation_cleaned_data.csv

reporting_tests_model_input:
  type: pandas.CSVDataset
  filepath: data/08_reporting/validation_model_input.csv

traffic_light_flag:
  type: text.TextDataset
  filepath: data/08_reporting/traffic_light.txt

production_model_metrics:       # artifact MLflow (JSON) — RMSE/MAE/R²
  type: kedro_mlflow.io.artifacts.MlflowArtifactDataset
  dataset:
    type: json.JSONDataset
    filepath: data/08_reporting/production_model_metrics.json

drift_result:
  type: pandas.CSVDataset
  filepath: data/08_reporting/drift_result.csv

drift_report:                   # HTML do nannyml/evidently
  type: text.TextDataset
  filepath: data/08_reporting/data_drift_report.html

shap_plot:                      # artifact MLflow (Matplotlib)
  type: kedro_mlflow.io.artifacts.MlflowArtifactDataset
  dataset:
    type: matplotlib.MatplotlibDataset
    filepath: data/08_reporting/shap_plot.png



