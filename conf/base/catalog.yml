# Data Catalog — house-price case (portugal_listings).
# Convention: anything that should go to MLflow uses MlflowArtifactDataset.
# Docs: https://docs.kedro.org/en/stable/data/data_catalog.html
#
# General TODO:
#   - confirm the types (CSV/Pickle/JSON/Matplotlib) and versioning
#   - datasets coming from the feature store (ingested_data/learning_data/test_data) can be
#     materialized as local CSVs for those without a Hopsworks key (see risks in the report)

# --- 01_raw -------------------------------------------------------------------
raw_house_data:
  type: pandas.CSVDataset
  filepath: data/01_raw/portugal_listings.csv
  load_args:
    low_memory: false
    encoding: latin-1      

# --- 02_intermediate ----------------------------------------------------------
ingested_data:
  type: pandas.CSVDataset
  filepath: data/02_intermediate/ingested_data.csv
  load_args:
    low_memory: false           # mixed types (many nulls) -> avoids DtypeWarning
    encoding: utf-8
  save_args:
    index: false
  fs_args:
    open_args_save:
      mode: "w"
      encoding: "utf-8"

learning_data:                  # reference for drift (training distribution)
  type: pandas.CSVDataset
  filepath: data/02_intermediate/learning_data.csv
  load_args:
    low_memory: false
    encoding: utf-8
  save_args:
    index: false
  fs_args:
    open_args_save:
      mode: "w"
      encoding: "utf-8"

test_data:                      # true out-of-sample test set for drift / inference
  type: pandas.CSVDataset
  filepath: data/02_intermediate/test_data.csv
  load_args:
    low_memory: false
    encoding: utf-8
  save_args:
    index: false
  fs_args:
    open_args_save:
      mode: "w"
      encoding: "utf-8"

cleaned_data:
  type: pandas.CSVDataset
  filepath: data/02_intermediate/cleaned_data.csv
  load_args:
    low_memory: false
    encoding: utf-8        # Portuguese accents (District/Type) — latin-1 mangled them,
    # which broke the GX District distinct-values check in data_unit_tests.
  save_args:
    index: false
  fs_args:
    open_args_save:
      mode: "w"
      encoding: "utf-8"
 
reporting_data_preprocessing:
  type: json.JSONDataset
  filepath: data/08_reporting/preprocessing_report.json

