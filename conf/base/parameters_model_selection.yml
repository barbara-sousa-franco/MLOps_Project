# Candidate models (challengers) + Optuna search spaces.

model_selection:
  metric: "rmse"             # rmse | mae | r2
  direction: "minimize"      # ⚠️ lower RMSE is better -> minimize
  n_trials: 30               # TODO: more trials = better model but slower (trade-off in the report)
  cv_folds: 3

  # STEP 1 — challengers: model types to compare
  candidates:
    - RandomForestRegressor
    - GradientBoostingRegressor
    # - XGBRegressor          # optional
    # - LGBMRegressor         # optional

  # STEP 2 — Optuna search spaces per model (TODO: tune)
  search_spaces:
    RandomForestRegressor:
      n_estimators: { low: 100, high: 600, step: 50 }
      max_depth: { low: 3, high: 30 }
      min_samples_leaf: { low: 1, high: 20 }
    GradientBoostingRegressor:
      n_estimators: { low: 100, high: 600, step: 50 }
      learning_rate: { low: 0.01, high: 0.3, log: true }
      max_depth: { low: 2, high: 8 }
