[project]
name = "my-mlops-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "confluent-kafka>=2.14.0",
    "docker>=7.1.0",
    "evidently>=0.7.21",
    "great-expectations>=1.16.1",
    "hopsworks==5.0.0",
    "ipywidgets>=8.1.8",
    "jupyterlab>=4.5.6",
    "kedro>=1.3.1",
    "kedro-datasets>=4.0.0",       # TODO: necessário p/ pandas.CSVDataset/Pickle/JSON/Matplotlib no catalog
    "kedro-mlflow>=2.0.2",
    "mlflow>=3.11.1",
    "optuna>=4.8.0",
    "prefect>=3.6.27",
    "scikit-learn>=1.6",           # modelos de regressão + métricas
    "shap>=0.46",                  # TODO: feature_selection (SHAP do champion)
    "setuptools<81",
    "ucimlrepo>=0.0.7",
    "vadersentiment>=3.3.2",
    "ydata-profiling<=4.18.3",
    # --- opcionais (descomentar conforme a escolha da equipa) ---
    # "nannyml>=0.12",             # alternativa/complemento ao evidently p/ drift
    # "pandera>=0.20",             # validação de schema (blueprint), além do Great Expectations
]
# TODO: depois de mexer aqui, re-gerar o lock e o requirements.txt:
#   uv lock && uv export --format requirements-txt -o requirements.txt
[tool.kedro]
package_name = "kedro_temp_mlops"
project_name = "my-mlops-project"
kedro_init_version = "1.3.1"

[tool.kedro_telemetry]
project_id = "90a3ff85835b4a218be60256690526c4"

[dependency-groups]
dev = [
    "black>=26.3.1",
    "pytest>=9.0.3",
    "pytest-cov>=6.0",      # add this — needed for --cov in pytest config
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
addopts = """
--cov-report term-missing \
--cov src/kedro_temp_mlops -ra"""
pythonpath = ["src"]

